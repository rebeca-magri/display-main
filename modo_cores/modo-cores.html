<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Cores Profissional - Aprendendo HTML e CSS</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- Section 1: Modelo RGB -->
    <section id:"rgb" class="color-section">
        <aside class="color-section_sidebar">
            <h2 class="color-section_title">Modelo RGB</h2>
            <nav>
                <a href="#rgb" class="color-section_link--active">RGB</a>
                <a href="#cmyk" class="color-section_link">CMYK</a>
            </nav>
        </aside>

        <div class="color-section_bar color-section_bar--rgb-1"></div>

        <div class="color-section_bar color-section_bar--rgb-2"></div>

        <div class="color-section_bar color-section_bar--rgb-3"></div>

        <div class="color-section_bar color-section_bar--rgb-4"></div>

        <div class="color-section_bar color-section_bar--rgb-5"></div>

        <div class="color-section_bar color-section_bar--rgb-6"></div>
        
    </section>

    <!-- Section 2: Modelo CMYK -->
    <section id="cmyk" class="color-section">

        <aside class="color-section_sidebar">
            <h2 class="color-section_title">Modelo CMYK</h2>
            <nav>
                <a href="#rgb" class="color-section_link">RGB</a>
                <a href="#cmyk" class="color-section_link--active">CMYK</a>
            </nav>
        </aside>

        <div class="color-section_bar color-section_bar--cmyk-1"></div>

        <div class="color-section_bar color-section_bar--cmyk-2"></div>

        <div class="color-section_bar color-section_bar--cmyk-3"></div>

        <div class="color-section_bar color-section_bar--cmyk-4"></div>

        <div class="color-section_bar color-section_bar--cmyk-5"></div>

        <div class="color-section_bar color-section_bar--cmyk-6"></div>  

    </section>

</body>
</html>
